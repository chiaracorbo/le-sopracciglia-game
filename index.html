<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sopracciglia">
<meta name="theme-color" content="#0a0806">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Le Sopracciglia della Guerra: Arena Combat — Metal Slug Edition</title>
<style>
  /* ===== BASE ===== */
  *, *::before, *::after { box-sizing: border-box; }
  :root { --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0806; font-family: monospace;
    touch-action: none; -webkit-user-select: none; user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap { position: relative; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; display: block;
  }
  /* Su mobile: canvas fullscreen senza bordi */
  @media (max-width: 1024px) and (pointer: coarse) {
    html, body { width: 100%; height: 100%; }
    #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { border: none; border-radius: 0; }
  }
  #scan { display: none; }

  /* ===== ROTATE HINT ===== */
  #rotate-hint {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: #0a0806; flex-direction: column;
    align-items: center; justify-content: center;
    color: #F5F0E1; font-size: clamp(14px, 4vw, 20px); text-align: center;
    padding: 24px; gap: 16px;
  }
  #rotate-hint .ri { font-size: clamp(48px, 14vw, 80px); }
  @media (orientation: portrait) { body:not(.in-title) #rotate-hint { display: flex !important; } }

  /* ===== FLOATING TOP BAR (Indietro / ♪ / Menu) ===== */
  #m-back, #m-esc, #m-music {
    display: none; position: fixed; z-index: 200;
    background: rgba(10,7,3,0.82); border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 10px; color: #C8BC9E; font-family: monospace;
    font-size: clamp(11px, 2.8vw, 14px);
    min-width: 52px; min-height: 44px;
    padding: 0 14px;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; -webkit-user-select: none;
    /* safe-area per iPhone notch */
    top: max(10px, env(safe-area-inset-top, 10px));
  }
  #m-back  { left:  max(10px, env(safe-area-inset-left,  10px)); }
  #m-music { right: max(10px, env(safe-area-inset-right, 10px)); z-index: 600; }
  #m-esc   { left:  max(10px, env(safe-area-inset-left,  10px)); }
  #m-back.pressed, #m-esc.pressed, #m-music.pressed, .sel-btn.pressed { background: rgba(100,70,10,0.85); color: #FFD700; }
  #m-back:active, #m-esc:active, #m-music:active {
    background: rgba(100,70,10,0.85); color: #FFD700;
  }

  /* ===== TITLE MENU BUTTONS ===== */
  #menu-btns {
    display: none; position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom, 12px));
    left: 0; right: 0; z-index: 101;
    flex-direction: column; align-items: center;
    gap: clamp(6px, 1.5vh, 12px);
    padding: 0 clamp(12px, 4vw, 32px);
  }
  .menu-btn {
    width: 100%; max-width: 380px;
    min-height: 52px;
    padding: 0 20px;
    font-size: clamp(14px, 3.5vw, 18px);
    font-family: monospace; font-weight: bold;
    color: #F5F0E1; text-align: center; cursor: pointer;
    background: rgba(28,18,5,0.94);
    border: 2px solid rgba(255,215,0,0.5);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    -webkit-user-select: none;
    transition: background .1s;
  }
  .menu-btn:active { background: rgba(120,85,10,0.95); border-color: #FFD700; }
  #mb-3 { color: #FF8C00; border-color: rgba(255,140,0,0.65); }
  #diff-btn {
    font-size: clamp(11px, 2.5vw, 14px); min-height: 40px;
    color: #B7A98C; border-color: rgba(255,255,255,0.18);
    background: rgba(15,10,4,0.88);
  }

  /* ===== SELECT SCREEN BUTTONS ===== */
  #select-btns {
    display: none; position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom, 12px));
    left: 0; right: 0; z-index: 101;
    flex-direction: row; justify-content: center;
    gap: clamp(8px, 2vw, 18px);
    padding: 0 clamp(12px, 4vw, 32px);
  }
  .sel-btn {
    flex: 1; max-width: 180px; min-height: 52px;
    padding: 0 16px;
    font-size: clamp(13px, 3.2vw, 16px); font-family: monospace; font-weight: bold;
    color: #F5F0E1; cursor: pointer; border-radius: 14px;
    background: rgba(28,18,5,0.95); border: 2px solid rgba(255,215,0,0.5);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    -webkit-user-select: none;
  }
  .sel-btn:active { background: rgba(120,85,10,0.95); }

  /* ===== COMANDI TOUCH DEL COMBATTIMENTO (stile picchiaduro mobile) ===== */
  #m-controls { display: none; position: fixed; inset: 0; z-index: 100; pointer-events: auto; }
  /* joystick: cerchio con manopola che segue il pollice */
  #m-dpad {
    position: absolute; width: min(36vh, 160px); height: min(36vh, 160px); border-radius: 50%;
    left: max(18px, calc(env(safe-area-inset-left) + 10px)); bottom: max(14px, env(safe-area-inset-bottom));
    background: radial-gradient(circle, rgba(255,255,255,.05) 0%, rgba(255,255,255,.12) 70%, rgba(255,255,255,.18) 100%);
    border: 2px solid rgba(160,230,255,.35); box-shadow: 0 0 18px rgba(80,200,255,.15) inset;
  }
  #m-knob {
    position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.95), rgba(210,225,235,.75) 60%, rgba(150,170,185,.7));
    box-shadow: 0 2px 8px rgba(0,0,0,.5); pointer-events: none; transition: transform .05s;
  }
  .dp {
    position: absolute; width: 22%; height: 22%; display: flex; align-items: center; justify-content: center;
    color: rgba(160,230,255,.55); font-size: min(4.2vh, 18px); pointer-events: none; touch-action: none;
  }
  .dp.on { color: #7DF9FF; text-shadow: 0 0 8px #7DF9FF; }
  #dp-u { left: 39%; top: 2%; } #dp-d { left: 39%; bottom: 2%; } #dp-l { left: 2%; top: 39%; } #dp-r { right: 2%; top: 39%; }
  /* pulsanti d'azione a ventaglio intorno allo SPECIAL */
  #m-btns {
    position: absolute; width: min(50vh, 220px); height: min(50vh, 220px);
    right: max(14px, calc(env(safe-area-inset-right) + 8px)); bottom: max(10px, env(safe-area-inset-bottom));
  }
  .ab {
    position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: min(2.4vh, 10px); letter-spacing: .03em;
    color: rgba(255,255,255,.85); -webkit-user-select: none; touch-action: none;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.16), rgba(20,30,45,.45));
    border: 2px solid rgba(255,255,255,.4); box-shadow: 0 2px 10px rgba(0,0,0,.35);
    transition: transform .05s, background .06s;
  }
  .ab .ic { font-size: min(6vh, 26px); line-height: 1; margin-bottom: 1px; }
  .ab.on { transform: scale(.92); background: radial-gradient(circle, rgba(255,255,255,.45), rgba(60,90,120,.55)); }
  #ab-s { width: 44%; height: 44%; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 40%, rgba(80,220,255,.55), rgba(0,90,150,.55)); border-color: rgba(125,249,255,.85);
    box-shadow: 0 0 16px rgba(80,220,255,.45); font-size: min(2.6vh, 11px); }
  #ab-s .ic { font-size: min(8vh, 34px); }
  #ab-s.on { background: radial-gradient(circle, #7DF9FF, rgba(0,120,190,.75)); }
  #ab-p { width: 31%; height: 31%; right: 50%; bottom: 2%; }   /* a sinistra dello special */
  #ab-k { width: 31%; height: 31%; right: 6%;  bottom: 50%; }  /* sopra lo special */
  #ab-b { width: 27%; height: 27%; right: 44%; bottom: 42%; }  /* in diagonale */

  /* ===== HOME SCREEN (poster a sinistra, titolo e pulsanti a destra) ===== */
  #home-screen {
    display: none; position: fixed; inset: 0; z-index: 500; overflow: hidden;
    background: radial-gradient(ellipse at 75% 30%, #1a1430 0%, #07060f 55%, #020206 100%);
    grid-template-columns: minmax(0, 46%) 1fr; align-items: center;
  }
  #hs-stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hs-poster {
    position: relative; height: 100%; overflow: hidden; pointer-events: none;
    /* sfuma il bordo destro e quello basso nello spazio */
    -webkit-mask-image: linear-gradient(to right, #000 62%, transparent 100%), linear-gradient(to bottom, #000 80%, transparent 100%);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, #000 62%, transparent 100%);
  }
  .hs-poster img {
    position: absolute; left: max(0px, env(safe-area-inset-left)); top: 0;
    height: 128%; width: auto;   /* la parte bassa (titolo stampato sul poster) resta fuori */
    image-rendering: auto;
  }
  .hs-right {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: max(40px, calc(env(safe-area-inset-top) + 34px)) max(20px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) 8px;
    gap: min(5vh, 26px);
  }
  .hs-title {
    margin: 0; text-align: center; color: #FFC107; text-transform: uppercase;
    font-family: 'Arial Black', 'Helvetica Neue', Impact, sans-serif; font-weight: 900;
    font-size: min(4vw, 10.5vh); line-height: 1.02; letter-spacing: .01em; white-space: nowrap;
    text-shadow: 0 3px 0 #8a5a00, 0 0 28px rgba(255,193,7,.35);
  }
  .hs-sub {
    margin: -1vh 0 0; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700;
    font-size: min(2vw, 4.4vh); text-shadow: 0 2px 6px rgba(0,0,0,.8); text-align: center;
  }
  .hs-menu { display: flex; flex-direction: column; gap: min(3vh, 14px); width: min(100%, 380px); }
  .hs-btn {
    min-height: max(52px, 15vh); width: 100%;
    font-family: 'Arial Black', 'Helvetica Neue', Impact, sans-serif; font-weight: 900;
    font-size: min(2.6vw, 5.6vh); letter-spacing: .04em; color: #FFC107;
    background: rgba(12,10,26,.75); border: 3px solid #FFC107; border-radius: 14px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer;
    transition: background .12s, color .12s, box-shadow .12s, transform .08s;
  }
  .hs-btn:hover, .hs-btn:active, .hs-btn.pressed {
    background: #FFC107; color: #1a1205;
    box-shadow: 0 0 22px rgba(255,193,7,.75), 0 0 48px rgba(255,193,7,.35);
  }
  .hs-btn:active, .hs-btn.pressed { transform: scale(.97); }
  #hb-diff {
    background: none; border: none; color: rgba(255,255,255,.6); min-height: 40px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: min(1.6vw, 3.6vh);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer;
  }
  #hb-diff-val { color: #FFC107; font-weight: 700; }

  /* telefono in verticale: poster in alto, titolo e pulsanti sotto */
  @media (orientation: portrait) {
    #home-screen { grid-template-columns: 1fr; grid-template-rows: 46% 54%; }
    .hs-poster { -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%); mask-image: linear-gradient(to bottom, #000 70%, transparent 100%); }
    .hs-poster img { height: auto; width: 100%; left: 0; top: -4%; }
    .hs-title { font-size: 7.6vw; } .hs-sub { font-size: 3.8vw; }
    .hs-btn { font-size: 5vw; min-height: 9vh; } #hb-diff { font-size: 3.6vw; }
  }
</style>
</head>

let W=854;const H=480,GROUND=440;

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
/* Background cache: ridisegna solo quando camX cambia */
function fit(){
  /* l'arena prende le proporzioni esatte della finestra: niente bande nere, su telefono e computer */
  const ratio=innerWidth/innerHeight;
  W=Math.round(Math.min(1700,Math.max(640,H*ratio)));
  if(cv.width!==W){cv.width=W;ctx.imageSmoothingEnabled=false;}
  const sc=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.round(W*sc)+'px'; cv.style.height=Math.round(H*sc)+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();

/* ---------- AUDIO ---------- */
let AC=null;
function beep(f,d,type='square',v=.06,slide=0){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),AC.currentTime+d);
    g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
function noise(d,v=.08){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const n=AC.createBufferSource(),buf=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate);
  const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
  n.buffer=buf;const g=AC.createGain();g.gain.value=v;n.connect(g);g.connect(AC.destination);n.start();}catch(e){}}
const sfx={
  hit:()=>{beep(180,.08,'square',.07,-60);noise(.05,.04)},
  kick:()=>{beep(120,.12,'square',.08,-50);noise(.07,.05)},
  block:()=>beep(420,.05,'triangle',.05),
  whoosh:()=>noise(.12,.05),
  special:()=>{beep(80,.3,'sawtooth',.08,200);beep(640,.15,'square',.04,-300)},
  chainsaw:()=>{for(let i=0;i<6;i++)setTimeout(()=>beep(70+Math.random()*50,.08,'sawtooth',.07),i*36)},
  ko:()=>{beep(300,.4,'sawtooth',.09,-220);setTimeout(()=>{beep(90,.6,'square',.08,-40);noise(.3,.09)},150)},
  sel:()=>beep(520,.05,'square',.05),
  ok:()=>beep(660,.1,'square',.06,120),
  boom:()=>{beep(55,.4,'sawtooth',.1,-25);noise(.25,.1)},
  zap:()=>beep(900,.22,'sawtooth',.06,-720),
  wave:()=>beep(220,.25,'sine',.07,160),
  buzz:()=>beep(110,.12,'square',.05,-30),
  casino:()=>{beep(300,.1,'square',.06,-100);setTimeout(()=>beep(200,.15,'square',.06,-120),100);setTimeout(()=>beep(120,.25,'square',.06,-80),220)},
  blinkS:()=>{beep(1100,.07,'sine',.05,-500);noise(.05,.03)},

/* ---------- MUSICA (tracce embedded) ---------- */
const MUSIC_SRC={menu:'music/menu.mp3',fight:'music/fight.mp3',win:'music/win.mp3',lose:'music/lose.mp3'};
const tracks={};
function _initTracks(src){
  for(const k in src){
    if(!tracks[k]){
      const a=new Audio(src[k]);a.loop=true;a.volume=0.45;a.preload=k==='menu'?'auto':'none';tracks[k]=a;
    }
  }
}
_initTracks(MUSIC_SRC);
window._loadMusic=function(src){_initTracks(src);};
let curTrack=null,audioUnlocked=false,musicMuted=false,wantTrack='menu';
addEventListener('keydown',()=>{audioUnlocked=true;},{once:true});
function ensureMusic(){
  if(!audioUnlocked)return;
  if(musicMuted){if(curTrack&&!curTrack.paused)curTrack.pause();return;}
  const t=tracks[wantTrack];
  if(!t){if(wantTrack==='hush'&&curTrack&&!curTrack.paused)curTrack.pause();return;}
  if(curTrack===t){if(t.paused){t.currentTime=0;t.play().catch(()=>{});}return;}
  if(curTrack){curTrack.pause();curTrack.currentTime=0;}
  curTrack=t;t.play().catch(()=>{});
}


/* ---------- COLOR UTILS (sfumature Metal Slug: shadow/base/highlight) ---------- */
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function shade(h,f){const[r,g,b]=hex2rgb(h);
  return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v*f))).toString(16).padStart(2,'0')).join('');}
function lift(h,a){const[r,g,b]=hex2rgb(h);
  return '#'+[r,g,b].map(v=>Math.round(Math.min(255,v+(255-v)*a)).toString(16).padStart(2,'0')).join('');}

/* ---------- FIGHTER ---------- */
class Fighter{
  constructor(cfg,x,facing,ctrl){
    Object.assign(this,{cfg,x,facing,ctrl});
    this.name=cfg.name;this.maxHp=cfg.hp;this.hp=cfg.hp;this.stamina=100;this.meter=0;
    this.y=GROUND;this.vy=0;this.state='idle';this.moveFr=0;this.cur=null;
    this.combo=0;this.comboT=0;this.hitstun=0;this.blockHeld=false;this.hitConsumed=false;
    this.flash=0;this.counterT=0;this.selfStun=0;this.burstLeft=0;this.burstT=0;
    this.input={};this.prev={};this.pBuf=0;this.kBuf=0;this.jumpSquat=0;this.wasAir=false;this.blockFlash=0;
    this.cooldown=0;this.invuln=0;this.spinHits=0;this.spinHitFr=-9;this.comebackOn=false;
    this.atkLag=0;this.parryT=0;this.stars=0;this.parryCD=0;
    this.defMod=1.15-(cfg.def||5)*0.03;
    this.jumpV=-Math.sqrt(2*0.6*(45+(cfg.aer||5)*4))*(cfg.heavyJump?Math.sqrt(.9):1);
    this.ai={cool:0,plan:'approach',planT:0};this.animT=0;this.readyPing=false;
  }
  get half(){return (this.exo>0&&this.cfg.exoHalf)||this.cfg.bodyHalf||this.cfg.h*0.17;}
  get dmgMul(){return (this.cfg.comeback&&this.hp/this.maxHp<0.4)?1.2:1;}
  get specialReady(){return this.meter>=this.cfg.special.cost&&this.cooldown<=0;}
  hurtbox(){const crouch=this.state==='crouch';const h=((this.exo>0&&this.cfg.exoH)||this.cfg.h)*(crouch?0.6:1);
    return {x:this.x-this.half,y:this.y-h,w:this.half*2,h};}
  onGround(){return this.y>=GROUND-0.5;}

  readInput(opp){
    const p=this.prev,i={};
    if(this.ctrl==='cpu'){this.aiThink(opp);Object.assign(i,this.aiOut);}
    else{const m=this.ctrl;for(const k in m)i[k]=!!keys[m[k]];}
    i.punchP=i.punch&&!p.punch;i.kickP=i.kick&&!p.kick;i.upP=i.up&&!p.up;i.specialP=i.special&&!p.special;
    i.blockP=i.block&&!p.block;
    this.prev={punch:i.punch,kick:i.kick,up:i.up,special:i.special,block:i.block};
    this.input=i;
  }

  gainMeter(v){const was=this.specialReady;
    this.meter=clamp(this.meter+v,0,METER_MAX);
    if(!was&&this.specialReady){sfx.ready();this.readyPing=true;
      ftext(this.x,this.y-this.cfg.h-16,'SPECIAL PRONTA!',this.cfg.brow,9);}}

  update(opp){
    this.animT++;
    if(this.state==='ko'){if(this.y<GROUND){this.vy+=0.6;this.y=Math.min(GROUND,this.y+this.vy);}return;}
    if(this.cooldown>0)this.cooldown--;
    if(this.invuln>0)this.invuln--;
    if(this.stamina<100&&this.state!=='block'&&this.state!=='attack')
      this.stamina=Math.min(100,this.stamina+0.25*(this.dmgMul>1?1.5:1));
    if(this.cfg.comeback&&!this.comebackOn&&this.hp/this.maxHp<0.4){this.comebackOn=true;
      ftext(this.x,this.y-this.cfg.h-20,'COMEBACK! +20%','#FF4136',11);fxBurst(this.x,this.y-this.cfg.h*.5,'purple',14);sfx.ready();}
    this.gainMeter(1/12); // +5 al secondo
    if(this.comboT>0&&--this.comboT===0)this.combo=0;
    if(this.flash>0)this.flash--;
    if(this.blockFlash>0)this.blockFlash--;
    if(this.atkLag>0)this.atkLag--;
    if(this.parryT>0)this.parryT--;if(this.parryCD>0)this.parryCD--;
    if(this.stars>0)this.stars--;
    if(this.counterT>0)this.counterT--;
    if(this.pBuf>0)this.pBuf--; if(this.kBuf>0)this.kBuf--;
    if(this.selfStun>0){this.selfStun--;return;}
    if(this.hitstun>0){this.hitstun--;
      if(!this.onGround()){this.vy+=0.6;this.y=Math.min(GROUND,this.y+this.vy);}
      if(this.hitstun===0)this.state='idle';return;}

    const i=this.input;
    if(this.burstLeft>0){if(--this.burstT<=0){this.fireBurst();this.burstT=4;this.burstLeft--;}}

    if(this.state==='attack'){
      // cancel normale → special se secondo tasto arriva subito dopo
      if(this.moveFr<=4&&this.cur&&this.cur.key!=='special'&&
        ((this.cur.key==='punch'&&i.kickP)||(this.cur.key==='kick'&&i.punchP)||i.specialP))
        this.attemptSpecial(opp,true);
      this.advanceAttack(opp);
    }
    else{
      if(this.onGround())this.facing=opp.x>=this.x?1:-1;
      if(i.blockP&&this.parryCD<=0)this.parryT=12; // finestra di parry: tap appena prima dell'impatto
      this.blockHeld=i.block&&this.onGround()&&this.stamina>0;
      if(this.blockHeld){this.state='block';}
      else{
        let moving=false;
        if(this.jumpSquat>0){this.state='jumpsquat';
          if(--this.jumpSquat===0){this.vy=this.jumpV;this.y-=1;dust(this.x,GROUND,5);sfx.whoosh();}}
        else if(this.onGround()){
          if(i.down){this.state='crouch';}
          else{
            if(i.left){this.x-=this.cfg.speed;moving=true;}
            if(i.right){this.x+=this.cfg.speed;moving=true;}
            if(moving&&this.animT%14===0)dust(this.x-this.facing*this.half,GROUND,2);
            if(i.upP)this.jumpSquat=2;
            this.state=moving?'walk':'idle';
          }
        }else{
          if(i.left)this.x-=this.cfg.speed*0.8;
          if(i.right)this.x+=this.cfg.speed*0.8;
          this.state='jump';
        }
        // attacchi (solo a terra, non in crouch)
        if(this.onGround()&&!i.down&&this.jumpSquat===0){
          const wantSpecial=i.specialP||(i.punchP&&(i.kick||this.kBuf>0))||(i.kickP&&(i.punch||this.pBuf>0));
          if(wantSpecial)this.attemptSpecial(opp,false);
          else if(i.punchP&&this.atkLag<=0){this.pBuf=5;this.startMove('punch');}
          else if(i.kickP&&this.atkLag<=0){this.kBuf=5;this.startMove('kick');}
        }
      }
    }
    if(!this.onGround()){this.vy+=0.6;const wasAir=this.y<GROUND;this.y=Math.min(GROUND,this.y+this.vy);
      if(wasAir&&this.onGround()){dust(this.x,GROUND,7,true);if(this.state==='jump')this.state='idle';}}
    this.x=clamp(this.x,this.half+4,W-this.half-4);
  }

  startMove(key){
    const m=this.exo>0&&this.cfg.exoMove?{...MOVES.kick,...this.cfg.exoMove}:{...MOVES[key],...((this.cfg.moves&&this.cfg.moves[key])||{})};
    this.stamina=Math.max(0,this.stamina-m.stCost);
    this.state='attack';this.hitConsumed=false;this.moveFr=0;
    this.cur={key,...m,recovery:Math.round(m.recovery*this.cfg.recMod)};
    if(key==='punch'&&this.cfg.punchDmg)this.cur.dmg=this.cfg.punchDmg;
    if(key==='kick'&&this.cfg.kickDmg)this.cur.dmg=this.cfg.kickDmg;
    this.cur.range+=(this.cfg.meleeR||0);
    if(key==='punch'&&this.cfg.punchRange)this.cur.range=this.cfg.punchRange;
    const SR=SPRITE_CHARS[this.cfg.id];
    if(SR&&SR.reach&&SR.reach[key])this.cur.range=Math.max(this.cur.range,Math.round(SR.reach[key]-(this.half-6)));
    sfx.whoosh();
  }
  attemptSpecial(opp,fromCancel){
    const s=this.cfg.special;
    if(s.type==='exo'&&this.exo>0)return; /* esoscheletro già indossato */
    if(this.meter<s.cost||this.cooldown>0){
      if(!fromCancel){sfx.buzz();
        ftext(this.x,this.y-this.cfg.h-14,this.cooldown>0?'RICARICA!':'METER!','#FF4136',9);}return;}
    this.meter-=s.cost;this.cooldown=s.cd;this.startSpecial(opp);
  }
  startSpecial(opp){
    const s=this.cfg.special;
    this.state='attack';this.hitConsumed=false;this.moveFr=0;
    this.cur={key:'special',dmg:s.dmg,startup:s.st,active:s.act,
      recovery:Math.round(s.rec*this.cfg.recMod),range:s.w||50,hh:s.hh||44,yFrac:.5,kb:s.kb,sType:s.type,s};
    whiteFlash=2;specialBanner={txt:s.name+'!',t:22,col:this.cfg.brow};
    specialCutIn={f:this,t:22};hitstop=Math.max(hitstop,8);specialFX(this);
    if(s.type==='melee_big')sfx.chainsaw();
    else if(s.type==='waves')sfx.wave();
    else if(s.type==='blink')sfx.blinkS();
    else sfx.special();
    if(s.type==='counter')this.counterT=s.dur;
    if(s.type==='spin'){this.spinHits=0;this.spinHitFr=-9;}
    if(s.type==='blink')this.invuln=s.st+6;
    if(s.type==='waves')this.pendingWaves=s.at.map((f,idx)=>({fr:f,r:s.radii[idx],done:false}));
    fxBurst(this.x,this.y-this.cfg.h*0.6,s.fx,10);
  }
  advanceAttack(opp){
    const m=this.cur;this.moveFr++;
    const aS=m.startup,aE=m.startup+m.active;
    const SC=SPRITE_CHARS[this.cfg.id];
    if(SC&&SC.kickLunge&&m.key==='kick'&&this.moveFr<=aS)this.x+=this.facing*SC.kickLunge/aS;
    if(m.rehit)for(const o of m.rehit)if(this.moveFr===aS+o)this.hitConsumed=false;
    if(m.smokeFx&&this.moveFr===aS)smokeBomb(this);
    if(m.s&&m.s.chainsaw){
      if(this.moveFr<=aS)this.x+=this.facing*m.s.lunge/aS;
      if(this.moveFr>=aS&&this.moveFr<aE){
        if((this.moveFr-aS)%7===0)sfx.chainsaw();
        shake=Math.max(shake,2.5);
        const B=SPRITE_CHARS[this.cfg.id].blade;
        if(this.moveFr%3===0){const p=spritePoint(this,rnd(B.x0,B.x1),B.y-rnd(2,8));
          _padd({x:p.x,y:p.y,vx:rnd(-.5,.5),vy:rnd(-1.4,-.6),life:24,max:24,col:['#9A9A9A','#B8B8B8','#777'][this.moveFr%3],sz:rnd(4,7),fade:true});}
        if(this.moveFr%2===0){const p=spritePoint(this,rnd(B.x0,B.x1),B.y);_padd({x:p.x,y:p.y,vx:this.facing*rnd(-1,1),vy:rnd(-2,0),life:6,max:6,col:'#FFB347',sz:2});}}}
    if(m.sType==='exo'){
      if(this.moveFr<aS&&this.moveFr%3===0){const p={x:this.x+rnd(-30,30),y:this.y-rnd(10,this.cfg.h)};
        spark(p.x,p.y,'#FFE94A',3,3);spark(p.x,p.y,'#7DF9FF',2,2);if(this.moveFr%9===0)beep(400+this.moveFr*20,.05,'square',.04);}
      if(this.moveFr===aS){this.exo=3;this.hitConsumed=true;whiteFlash=Math.max(whiteFlash,2);shake=Math.max(shake,8);

    if(m.sType==='clones'&&(this.moveFr===aS+6||this.moveFr===aS+12)){this.hitConsumed=false;slashTrail(this,'special');}

    if(m.slashFx||(m.s&&m.s.slashFx)){const SCt=SPRITE_CHARS[this.cfg.id],tk=m.key==='special'&&!(SCt&&SCt.trails&&SCt.trails.special)?'punch':m.key;

  resolveSpecialStart(opp){

      this.hitConsumed=true;smokePuff(this.x+this.facing*26,this.y-this.cfg.h*0.7,4);}
    if(t==='lightning'){const tx=opp.x;sfx.zap();
      for(let i=0;i<8;i++)particles.push({x:tx+rnd(-12,12),y:GROUND-rnd(0,40),vx:0,vy:-1,life:16,max:16,col:'#7DF9FF',sz:3});

  fireWave(w,opp){

  /* sparo dalla bocca dell'arma verso l'avversario */

    const p=g?spritePoint(this,g.x,g.y):{x:this.x+this.facing*28,y:this.y-this.cfg.h*.55};
    const big=m.shotBig;

    else{beep(880,.05,'square',.05);noise(.04,.05);}

  teleportStep(m,opp){

    beep(620,.04,'square',.04);}

  checkHit(opp){
    if(this.hitConsumed)return;
    const m=this.cur;
    let reach=m.range,hh=m.hh||34;
    if(m.sType==='grab'){reach=m.s.reach*Math.min(1,(this.moveFr-m.startup+1)/m.active);hh=30;}
    let hb;
    if(m.sType==='spin'){const r=m.s.r;hb={x:this.x-r,y:this.y-this.cfg.h*0.9,w:r*2,h:this.cfg.h*0.9};}
    else hb={x:this.facing>0?this.x+this.half-6:this.x-this.half+6-reach,
      y:this.y-this.cfg.h*m.yFrac-hh/2,w:reach,h:hh};
    if(opp.state!=='ko'&&aabb(hb,opp.hurtbox())){
      if(m.sType==='spin'){
        if(this.spinHits>=(m.s.hits||3)||this.moveFr-this.spinHitFr<3)return;
        this.spinHits++;this.spinHitFr=this.moveFr;
        const tick=(m.dmg/(m.s.hits||3))*(this.cfg.power/7)*this.dmgMul;
        opp.takeDamage(tick*COMBO_MUL[Math.min(this.combo,3)],m.kb/(m.s.hits||3)+6,this);
        fxBurst(opp.x,opp.y-opp.cfg.h*0.6,m.s.fx,8);
        return;}
      this.hitConsumed=true;
      if(m.key==='punch'||m.key==='kick'||m.sType==='flurry')meleeFX(this,opp,m.key);
      if(m.s&&m.s.chainsaw)blood(opp.x,opp.y-opp.cfg.h*.5,3);
      let dmgBase=m.dmg;
      if(m.key==='special'&&m.s.airDmg&&!opp.onGround())dmgBase=m.s.airDmg;
      const base=dmgBase*(this.cfg.power/7)*this.dmgMul;
      opp.takeDamage(base*COMBO_MUL[Math.min(this.combo,3)],m.kb,this);
      if(m.key==='special')fxBurst(opp.x,opp.y-opp.cfg.h*0.6,m.s.fx,16);
      if(m.sType==='grab'){sfx.boom();shake=Math.max(shake,10);whiteFlash=1;}
    }
  }
  registerHit(){this.combo=Math.min(this.combo+1,99);this.comboT=COMBO_WIN;this.gainMeter(12);}

  takeDamage(raw,kb,attacker){
    if(this.state==='ko')return;
    if(this.invuln>0){ftext(this.x,this.y-this.cfg.h-10,'MISS!','#FFE94A',10);
      spark(this.x,this.y-this.cfg.h*.5,'#FFE94A',5,2);return;}
    raw*=this.defMod;
    if(this.counterT>0){this.counterT=0;sfx.special();whiteFlash=1;
      ftext(this.x,this.y-this.cfg.h-26,'CONTROMOSSA!','#9B59B6',11);
      fxBurst(this.x,this.y-this.cfg.h*0.5,'purple',16);
      attacker.takeDamage(this.cfg.special.dmg*((this.cfg.power+3)/7),this.cfg.special.kb,this);
      return;}
    let dmg=raw,blocked=false;
    /* colpi che sfondano la guardia: niente parata né parry */
    const gb=attacker&&attacker.cur&&attacker.cur.guardBreak;
    if(gb&&(this.blockHeld||this.parryT>0)){this.parryT=0;this.blockHeld=false;this.state='idle';
      ftext(this.x,this.y-this.cfg.h-18,'GUARDIA SFONDATA!','#FF8C00',10);sfx.casino();}
    if(this.blockHeld&&this.parryT>0&&this.state!=='attack'){
      this.parryT=0;this.stamina=Math.max(0,this.stamina-3);this.invuln=Math.max(this.invuln,10);
      attacker.selfStun=80;attacker.stars=80;attacker.cur=null;attacker.state='idle';
      attacker.burstLeft=0;attacker.pendingWaves=null;attacker.hitstun=0;
      whiteFlash=1;sfx.parry();shake=Math.max(shake,5);hitstop=Math.max(hitstop,5);
      ftext(this.x,this.y-this.cfg.h-22,'PARRY! +25','#FFE94A',13);this.gainMeter(25);this.parryCD=90;
      ftext(attacker.x,attacker.y-attacker.cfg.h-14,'STORDITO!','#FF8C00',10);
      ring(this.x+this.facing*(this.half+6),this.y-this.cfg.h*.55,'#FFFFFF',4,42);
      fxBurst(attacker.x,attacker.y-attacker.cfg.h*.8,'yellow',10);
      return;}
    if(this.blockHeld&&this.state!=='attack'){dmg*=0.5;blocked=true;
      this.blockFlash=8;this.gainMeter(4);
      this.stamina=Math.max(0,this.stamina-2);sfx.block(); // costo fisso 2 per parata
      spark(this.x+this.facing*this.half,this.y-this.cfg.h*0.55,'#9CC4FF',10,3);
      spark(this.x+this.facing*this.half,this.y-this.cfg.h*0.55,'#FFFFFF',5,2);
      ring(this.x+this.facing*(this.half+6),this.y-this.cfg.h*0.55,'#9CC4FF',3,26);
      if(this.stamina===0){this.blockHeld=false;this.selfStun=20;
        ftext(this.x,this.y-this.cfg.h-18,'GUARDIA ROTTA!','#FF4136',11);
        fxBurst(this.x,this.y-this.cfg.h*0.55,'blue',14);sfx.casino();}}
    else{this.state='hitstun';this.hitstun=8+Math.floor(kb/5);
      attacker.registerHit();this.gainMeter(6);this.flash=6;
      blood(this.x,this.y-this.cfg.h*0.6,dmg>10?14:7);
      spark((this.x+attacker.x)/2,this.y-this.cfg.h*0.6,'#FFFF00',8,3);
      spark((this.x+attacker.x)/2,this.y-this.cfg.h*0.6,'#FFFFFF',4,2);
      (kb>12?sfx.kick:sfx.hit)();
      hitstop=dmg>14?6:3;shake=Math.max(shake,Math.min(10,kb/4));}
    this.hp=Math.max(0,this.hp-Math.round(dmg));
    this.x+=kb*attacker.facing*(blocked?0.4:1);
    if(!blocked)ftext(this.x,this.y-this.cfg.h-8,Math.round(dmg),'#FFF',10);
    if(this.hp===0&&this.exo>0){this.exo=0;exoBreak(this);}
    if(this.hp===0){this.state='ko';this.vy=-7;this.hitstun=0;sfx.ko();shake=12;
      blood(this.x,this.y-this.cfg.h*0.5,26);game.onKO(this);}
  }

  /* -------- CPU AI v1.1 — behavior tree potenziato -------- */
  aiThink(opp){
    const a=this.ai;a.cool--;
    if(a.retreat===undefined)a.retreat=0;
    if(a.doublePunch===undefined)a.doublePunch=0;
    if(a.parryHold===undefined)a.parryHold=0;
    if(a.jumpAtk===undefined)a.jumpAtk=0;
    if(a.wakeUp===undefined)a.wakeUp=0;
    if(a.zoneT===undefined)a.zoneT=0;
    const d=this.aiDiff||{freq:1,parry:.2};
    const dx=opp.x-this.x,dist=Math.abs(dx)-this.half-opp.half,dir=Math.sign(dx)||1;
    const o={left:false,right:false,up:false,down:false,punch:false,kick:false,block:false,special:false};
    const hpr=this.hp/this.maxHp,ohpr=opp.hp/opp.maxHp;
    const sType=this.cfg.special.type;
    const hasProj=!!this.cfg.punchProjectile;
    const sRange=sType==='clones'?130:sType==='exo'?999:sType==='laser'||sType==='star'||sType==='rift'||sType==='barrage'||sType==='teleport'||sType==='axegun'||sType==='pump3'?400:sType==='flurry'?70:sType==='waves'?90:sType==='lightning'?240:sType==='blink'?160:sType==='grenade'?220:sType==='dash'?150:sType==='grab'?130:sType==='cone'?170:90;

    // PARRY reattivo: finestra parry aumentata, rispetta parryCD
    if(a.parryHold>0){a.parryHold--;o.block=true;this.aiOut=o;return;}
    if(this.parryCD<=0&&opp.state==='attack'&&opp.cur&&opp.cur.key!=='special'){
      const fr=opp.cur.startup-opp.moveFr;
      if(fr<=3&&fr>=0&&dist<70&&Math.random()<d.parry){a.parryHold=8;o.block=true;this.aiOut=o;return;}}

    // WAKE-UP PRESSURE: insegui dopo knockdown
    if(opp.state==='ko'||opp.hitstun>30)a.wakeUp=22;
    if(a.wakeUp>0){a.wakeUp--;
      if(dir>0)o.right=true;else o.left=true;
      if(dist<50&&a.cool<=0){o.punch=true;a.cool=14*d.freq;}
      this.aiOut=o;return;}

    // ZONING: proiettile a media distanza
    if(a.zoneT>0)a.zoneT--;
    if(hasProj&&dist>90&&dist<200&&a.cool<=0&&a.zoneT<=0&&Math.random()<.35){
      o.punch=true;a.cool=22*d.freq;a.zoneT=60;this.aiOut=o;return;}

    // STATO: 6 stati
    let st;
    if(hpr<0.25)st='comeback';
    else if(hpr<0.5)st='defensive';
    else if(ohpr<0.3&&dist<80)st='finisher';
    else if(dist>90)st='approach';
    else if(dist>35)st='neutral';
    else st='aggression';

    if(a.retreat>0){a.retreat--;if(dir>0)o.left=true;else o.right=true;}

    if(st==='approach'){
      if(dir>0)o.right=true;else o.left=true;
      if(a.cool<=0&&dist<130&&Math.random()<.18&&a.jumpAtk<=0){
        o.up=true;if(dir>0)o.right=true;else o.left=true;o.kick=true;a.jumpAtk=40;a.cool=28*d.freq;}
      if(opp.cur&&opp.cur.key==='special'&&Math.random()<.5)o.up=true;
    }else if(st==='neutral'){
      if(a.cool<=0&&a.retreat<=0){const r=Math.random();
        if(r<.35){o.punch=true;a.cool=14*d.freq;}
        else if(r<.60){o.kick=true;a.cool=22*d.freq;}
        else if(r<.74){a.retreat=18;a.cool=10;}
        else if(r<.88){o.up=true;if(dir>0)o.right=true;else o.left=true;a.cool=22;}
        else if(r<.95){o.down=true;a.cool=10;}
        else{o.block=true;a.cool=16;}}
    }else if(st==='aggression'){
      if(this.specialReady&&dist<sRange&&a.cool<=0&&opp.onGround()&&Math.random()<.8){o.punch=true;o.kick=true;a.cool=36*d.freq;}
      else if(opp.blockHeld&&Math.random()<.45&&a.retreat<=0){a.retreat=14;}
      else if(a.cool<=0&&a.retreat<=0){
        if(a.doublePunch>0){a.doublePunch--;o.punch=true;a.cool=15*d.freq;}
        else{const r=Math.random();
          if(r<.5){o.punch=true;a.doublePunch=1;a.cool=15*d.freq;}
          else if(r<.78){o.kick=true;a.cool=22*d.freq;}
          else{o.up=true;o.kick=true;a.cool=22;}}}
    }else if(st==='defensive'){
      if(opp.state==='attack'&&dist<80)o.block=Math.random()<(.55+d.parry*.3);
      if(a.cool<=0&&a.retreat<=0){const r=Math.random();
        if(r<.32){a.retreat=20;a.cool=12;}
        else if(r<.55&&dist<65){o.kick=true;a.cool=24*d.freq;}
        else if(r<.68&&this.specialReady&&dist<sRange){o.punch=true;o.kick=true;a.cool=40*d.freq;}
        else if(r<.82&&dist<50){o.punch=true;a.cool=16*d.freq;}
        else a.cool=10;}
      if(dist>110){if(dir>0)o.right=true;else o.left=true;}
    }else if(st==='finisher'){
      if(this.specialReady&&dist<Math.max(sRange,100)&&a.cool<=0){o.punch=true;o.kick=true;a.cool=30*d.freq;}
      else if(a.cool<=0){if(dist>36){if(dir>0)o.right=true;else o.left=true;}
        else{const r=Math.random();
          if(r<.55){o.punch=true;a.cool=13*d.freq;}else{o.kick=true;a.cool=20*d.freq;}}}
    }else if(st==='comeback'){
      if(this.specialReady&&dist<Math.max(sRange,130)&&a.cool<=0){o.punch=true;o.kick=true;a.cool=32*d.freq;}
      else if(a.cool<=0){const r=Math.random();
        if(r<.28){o.up=true;if(dir>0)o.right=true;else o.left=true;a.cool=16;}
        else if(r<.55){if(dist>36){if(dir>0)o.right=true;else o.left=true;}else{o.punch=true;a.cool=12*d.freq;}}
        else if(r<.8&&dist<65){o.kick=true;a.cool=22*d.freq;}
        else{o.block=true;a.cool=14;}}
    }
    if(a.jumpAtk>0)a.jumpAtk--;
    this.aiOut=o;
  }
}

const BACKGROUNDS=['Campo al tramonto','Cripta','Cantiere della Torre','Citta nella caverna','Miniera rossa','Rifugio nella grotta',
  'Astronave','Horny Alpaca','Salone del Fronte','Villaggio delle due lune','Via dei dinosauri','Tetti in fiamme','Fattoria',
  'Piazza del borgo','Sala del trono'];
const BG_IMG={};
function loadBg(i){if(BG_IMG[i])return;const im=new Image();im.src='backgrounds/bg'+String(i+1).padStart(2,'0')+'.png';BG_IMG[i]=im;}
/* disegna lo sfondo riempiendo tutta l'arena (taglia i lati, non deforma) */
function drawBg(i){const im=BG_IMG[i];if(!im||!im.complete||!im.naturalWidth)return false;
  const sc=Math.max(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*sc,h=im.naturalHeight*sc;
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(im,(W-w)/2,H-h,w,h);
  /* leggera ombra in basso per far risaltare i personaggi */
  const g=ctx.createLinearGradient(0,GROUND-40,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=g;ctx.fillRect(0,GROUND-40,W,H-GROUND+40);ctx.restore();return true;}

(()=>{for(const id in SPRITE_CHARS){const S=SPRITE_CHARS[id];S.img={};let left=0;

/* fin dove arriva l'arma (in pixel dal centro del personaggio) durante la fase attiva di pugno e calcio */
function measureReach(S){
  S.reach={};
  try{const c=document.createElement('canvas');c.width=S.fw;c.height=S.fh;const x=c.getContext('2d');
    for(const key of ['punch','kick']){const a=S.anims[key];if(!a)continue;
      let f0,f1;if(a.tl){const g=a.tl.find(g=>g.to==='a')||a.tl[0];f0=g.f0;f1=g.f1;}else{f0=a.hit;f1=a.hit+(a.act||1)-1;}
      let m=-1;for(let f=f0;f<=f1;f++){x.clearRect(0,0,S.fw,S.fh);x.drawImage(S.img[a.file],-f*S.fw,0);
        const d=x.getImageData(0,0,S.fw,S.fh).data;
        for(let yy=0;yy<S.fh;yy++)for(let xx=S.fw-1;xx>m;xx--)if(d[(yy*S.fw+xx)*4+3]>40){m=xx;break;}}
      if(m>0)S.reach[key]=(m-S.ax)*S.scale;}
  }catch(e){}
}
/* un'immagine è usabile solo se esiste ed è stata caricata */
function imgOk(im){return !!(im&&im.complete&&im.naturalWidth>0);}

/* punto dello sprite (px,py) → coordinate nell'arena, tenendo conto del verso */
function spritePoint(f,px,py){const S=SPRITE_CHARS[f.cfg.id];

/* sceglie animazione e fotogramma dallo stato del combattente */
function spriteFrame(f,S){
  const A=S.anims;let key,fi=0;
  if(f.state==='ko')key='ko';
  else if(f.state==='attack'&&f.cur)key=f.cur.key;
  else if(f.state==='hitstun')key='hurt';
  else if(f.state==='block'||f.state==='crouch')key='block';
  else if(f.state==='jumpsquat'||f.state==='jump'||!f.onGround())key='jump';
  else if(f.state==='walk')key='walk';
  else key='idle';
  if(f.exo>0&&S.exoMap&&S.exoMap[key]&&A[S.exoMap[key]])key=S.exoMap[key];
  if(f._sk!==key){f._sk=key;f._st0=f.animT;f._sdur=f.hitstun+1;}
  const t=f.animT-f._st0,a=A[key]||A.idle,n=a.n;
  if(key==='special'&&a.teleport){
    const m=f.cur,T=m.s,fr=f.moveFr,c=A.cast,te=T.castFr+T.vanishFr;
    if(fr<T.castFr)return {a:c,fi:Math.floor(fr*c.fps/60)%9,alpha:1};
    if(fr<te)return {a:c,fi:8,alpha:1-(fr-T.castFr)/T.vanishFr};
    if(fr<m.startup){const p=(fr-te)/(m.startup-te);return {a,fi:Math.floor(p*a.hit),alpha:Math.min(1,p*1.5)};}
  }
  if((key==='punch'||key==='kick'||key==='special')&&a.tl){
    const m=f.cur,fr=f.moveFr,end=m.startup+m.active+m.recovery;
    const at=v=>v==='s'?m.startup:v==='a'?m.startup+m.active:v==='end'?end:v;
    let from=0;for(const g of a.tl){const to=at(g.to);if(fr<to||g===a.tl[a.tl.length-1]){
      const p=Math.min(1,Math.max(0,(fr-from)/Math.max(1,to-from)));
      return {a,fi:Math.min(g.f1,g.f0+Math.floor(p*(g.f1-g.f0+1)))};}from=to;}
  }
  if(key==='exoPunch')key='punch';
  if(key==='exoHurt')key='hurt';
  if(key==='punch'||key==='kick'||key==='special'){
    const m=f.cur,s=m.startup,ac=m.active,r=m.recovery,fr=f.moveFr,h=a.hit,k=a.act||1;
    if(fr<s)fi=Math.floor(fr/s*h);
    else if(fr<s+ac)fi=h+Math.floor((fr-s)/ac*k);
    else if(a.recReverse)fi=h+k-1-Math.floor((fr-s-ac)/Math.max(1,r)*(h+k));
    else fi=h+k+Math.floor((fr-s-ac)/Math.max(1,r)*(n-h-k));
  }
  else if(key==='hurt')fi=Math.floor(t/f._sdur*n);
  else if(key==='ko')fi=Math.floor(t*a.fps/60);
  else if(key==='block'){const h=a.holdFrom;fi=Math.floor(t*a.fps/60);
    if(fi>=h)fi=h+Math.floor((t*8/60))%(n-h);}
  else if(key==='jump'){const j=a.jf;
    if(f.state==='jumpsquat')fi=j.squat;
    else if(f.vy<-2)fi=j.up;
    else if(f.vy<2)fi=j.peak;
    else fi=f.y>GROUND-30?j.land:j.down;
  }
  else{
    fi=Math.floor(t*a.fps/60);
    if(a.pingpong){const p=2*n-2;fi%=p;if(fi>=n)fi=p-fi;}else fi%=n;
    /* camminando all'indietro l'animazione va al contrario */
    if(key==='walk'&&f.input&&((f.facing>0&&f.input.left)||(f.facing<0&&f.input.right)))fi=n-1-fi;
  }
  return {a,fi:Math.max(0,Math.min(n-1,fi))};
}

const sprTint=document.createElement('canvas');const sprTctx=sprTint.getContext('2d');
function drawSpriteFrame(S,a,fi,x,y,sc,facing,flash){
  const img=S.img[a.file],w=S.fw*sc,h=S.fh*sc;
  if(!imgOk(img))return false;
  ctx.save();ctx.imageSmoothingEnabled=false;
  ctx.translate(Math.round(x),Math.round(y));if(facing<0)ctx.scale(-1,1);
  if(flash){ /* lampo bianco quando viene colpito */
    sprTint.width=S.fw;sprTint.height=S.fh;sprTctx.imageSmoothingEnabled=false;
    sprTctx.drawImage(img,fi*S.fw,0,S.fw,S.fh,0,0,S.fw,S.fh);
    sprTctx.globalCompositeOperation='source-in';sprTctx.fillStyle='#FFFFFF';sprTctx.fillRect(0,0,S.fw,S.fh);
    sprTctx.globalCompositeOperation='source-over';
    ctx.drawImage(sprTint,-S.ax*sc,-S.ay*sc,w,h);
  }else ctx.drawImage(img,fi*S.fw,0,S.fw,S.fh,-S.ax*sc,-S.ay*sc,w,h);

function drawSpriteBody(f){

    sprTint.width=S.fw;sprTint.height=S.fh;sprTctx.imageSmoothingEnabled=false;

    sprTctx.globalCompositeOperation='source-in';sprTctx.fillStyle='#FFE94A';sprTctx.fillRect(0,0,S.fw,S.fh);

    if(frame%3===0){const g=spritePoint(f,S.glow.x+rnd(-30,30),S.glow.y+rnd(-50,40));
      _padd({star:true,x:g.x,y:g.y,vx:0,vy:-.8,life:14,max:14,col:'#FFE94A',sz:3});}}

    const m=f.cur,end=m.startup+m.active+m.recovery,k=Math.min(1,f.moveFr/6,(end-f.moveFr)/8);

function drawStar(x,y,R,r,rot,col){
  ctx.fillStyle=col;ctx.beginPath();

    const px=x+Math.cos(an)*rr,py=y+Math.sin(an)*rr;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
  ctx.closePath();ctx.fill();
}

/* ---------- EFFETTI DISEGNATI (scie, lampi) ---------- */
let fxObjs=[];
function updateFxObjs(){for(const o of fxObjs){o.t++;if(o.update)o.update(o);}fxObjs=fxObjs.filter(o=>o.t<o.life);}

/* scia rossa del fendente: arco davanti al personaggio, segue il personaggio */
function slashTrail(f,key){
  const S=SPRITE_CHARS[f.cfg.id],c=(S.trails&&S.trails[key])||S.slash;
  if(c.claws){const flip=c.flip?-1:1;fxObjs.push({t:0,life:9,draw(o){
    const p=spritePoint(f,c.x,c.y),R=c.r*S.scale,k=1-o.t/o.life,dir=f.facing;
    const a0=c.a0*flip,a1=c.a1*flip;
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(dir,1);ctx.lineCap='round';
    for(let i=0;i<3;i++){const r=R-6+i*6;
      ctx.globalAlpha=k*.55;ctx.strokeStyle='#8FA3B8';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke();
      ctx.globalAlpha=k;ctx.strokeStyle=c.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke();}
    ctx.restore();ctx.globalAlpha=1;}});return;}
  fxObjs.push({t:0,life:10,draw(o){
    const p=spritePoint(f,c.x,c.y),R=c.r*S.scale,k=1-o.t/o.life,dir=f.facing;
    const a0=c.a0!==undefined?c.a0:-1.45,a1=c.a1!==undefined?c.a1:.15; /* da sopra fino in avanti, verso il basso */
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(dir,1);
    ctx.globalAlpha=k*.9;ctx.strokeStyle=c.col;ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,0,R-3,a0+o.t*.04,a1);ctx.stroke();
    ctx.globalAlpha=k*.7;ctx.strokeStyle=c.col==='#FF2A2A'?'#FF8080':'#B8FFFF';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,R,a0+o.t*.04,a1);ctx.stroke();
    ctx.globalAlpha=k;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R+2,a0+o.t*.06,a1);ctx.stroke();
    ctx.globalAlpha=k*.3;ctx.fillStyle=c.col;ctx.beginPath();ctx.arc(0,0,R,a0,a1);ctx.arc(0,0,R*.55,a1,a0,true);ctx.fill();
    ctx.restore();ctx.globalAlpha=1;}});

/* fumogeno: lampo bianco e nuvola di fumo grigio intorno al personaggio */

/* squarcio spazio-temporale blu: si apre, resta, si richiude */
function drawRift(x,y,open,t){

  const h=46*open,w=14*open;
  ctx.save();
  ctx.globalAlpha=.35*open;ctx.fillStyle='#1E90FF';ctx.beginPath();ctx.ellipse(x,y,w*2.2,h*1.25,0,0,7);ctx.fill();
  ctx.globalAlpha=.9*open;ctx.fillStyle='#0A1A4A';ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,7);ctx.fill();

  for(let i=0;i<=24;i++){const an=i/24*Math.PI*2,j=1+Math.sin(an*5+t*.5)*.12;
    const px=x+Math.cos(an)*w*j,py=y+Math.sin(an)*h*j;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
  ctx.stroke();
  ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1;ctx.globalAlpha=open*.8;
  ctx.beginPath();ctx.ellipse(x,y,w*.45,h*.8,0,0,7);ctx.stroke();
  /* vortice */
  for(let i=0;i<4;i++){const an=t*.3+i*1.57;ctx.fillStyle=i%2?'#7DF9FF':'#FFFFFF';
    ctx.fillRect(x+Math.cos(an)*w*.6-1,y+Math.sin(an)*h*.6-1,3,3);}
  ctx.restore();ctx.globalAlpha=1;

function openRifts(f,opp){
  const S=SPRITE_CHARS[f.cfg.id],fp=spritePoint(f,S.fist.x,S.fist.y);
  const ax=fp.x+f.facing*4,ay=fp.y;
  /* secondo squarcio: alle spalle dell'avversario, all'altezza del petto */
  const bx=clamp(opp.x+f.facing*(opp.half+30),20,W-20),by=opp.y-opp.cfg.h*.55;
  const life=f.cur.active+f.cur.recovery,dmg=f.cur.s.dmg,kb=f.cur.s.kb;
  sfx.blinkS();shake=Math.max(shake,4);
  ring(ax,ay,'#7DF9FF',4,40);ring(bx,by,'#7DF9FF',4,40);
  const c=S.fist.crop,img=S.img[S.anims.special.file];let hit=false;
  const outAt=t=>Math.max(0,Math.min(1,(t-3)/4))*(t>life-8?Math.max(0,(life-t-2)/6):1);
  fxObjs.push({t:0,life,
  update(o){
    if(!hit&&outAt(o.t)>=1&&opp.state!=='ko'){hit=true;
      const tip={x:bx+(-f.facing)*c.w*S.scale,y:by},hb=opp.hurtbox();
      if(aabb({x:Math.min(bx,tip.x)-6,y:by-14,w:Math.abs(tip.x-bx)+12,h:28},hb)){
        opp.takeDamage(dmg*(f.cfg.power/7)*f.dmgMul,kb,f);
        spark(tip.x,tip.y,'#7DF9FF',14,5);spark(tip.x,tip.y,'#FFFFFF',6,3);ring(tip.x,tip.y,'#1E90FF',4,36);}}},
  draw(o){
    const open=Math.min(1,o.t/5,(o.life-o.t)/6);
    drawRift(ax,ay,open,o.t);drawRift(bx,by,open,o.t);
    /* il pugno esce dal secondo squarcio, rivolto verso l'avversario */
    const out=outAt(o.t);
    if(out>0){const dir=-f.facing,sc=S.scale,len=c.w*sc*out;
      ctx.save();ctx.imageSmoothingEnabled=false;ctx.beginPath();
      /* ritaglia: si vede solo la parte uscita dallo squarcio */
      ctx.rect(dir>0?bx:bx-len,by-c.h*sc,len,c.h*sc*2);ctx.clip();
      ctx.translate(bx+dir*(len-c.w*sc),by);if(dir<0)ctx.scale(-1,1);
      ctx.drawImage(img,c.frame*S.fw+c.x,c.y,c.w,c.h,0,-(S.fist.y-c.y)*sc,c.w*sc,c.h*sc);
      ctx.restore();}

function playClassical(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return;}
  /* Mozart, Eine kleine Nachtmusik (inizio) */
  const N={D4:293.7,Fs4:370,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,G3:196,D3:146.8};
  const mel=[['G4',.4],['D4',.2],['G4',.4],['D4',.2],['G4',.2],['D4',.2],['G4',.2],['B4',.2],['D5',.8],
    ['C5',.4],['A4',.2],['C5',.4],['A4',.2],['C5',.2],['A4',.2],['Fs4',.2],['A4',.2],['D4',.8]];
  let t=AC.currentTime+.05;
  for(const [n,d] of mel){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=N[n];
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d*.95);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d;}
  let tb=AC.currentTime+.05;for(const [n,d] of [['G3',1.6],['G3',1.0],['D3',1.6],['D3',1.0]]){const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=N[n];g.gain.setValueAtTime(.06,tb);g.gain.exponentialRampToValueAtTime(.0001,tb+d);
    o.connect(g);g.connect(AC.destination);o.start(tb);o.stop(tb+d);tb+=d;}
  return t-AC.currentTime;
}

/* ---------- GAME STATE ---------- */
const game={
  state:'title',mode:1,stage:0,sel:[0,1],pickTurn:0,tournament:null,difficulty:'normale',
  cpuDiff(){
    const finale=this.mode===3&&this.tournament&&this.tournament.idx===this.tournament.order.length-1;
    return finale?DIFFS.boss:DIFFS[this.difficulty];},
  p:[null,null],round:1,wins:[0,0],timer:99,timerF:0,
  banner:'',bannerT:0,freeze:0,koPending:false,matchWinner:null,
  reset(){particles=[];projectiles=[];beams=[];fxObjs=[];floatTexts=[];frameTimers=[];shake=0;hitstop=0;whiteFlash=0;specialBanner=null;specialCutIn=null;},
  startMatch(){this.reset();this.playerLost=false;this.stage=(Math.random()*STAGES.length)|0;
    this.bg=(Math.random()*BACKGROUNDS.length)|0;loadBg(this.bg);
    this.round=1;this.wins=[0,0];this.startRound();this.state='fight';},
  startTournament(){
    const me=this.sel[0];
    const order=ROSTER.map((c,i)=>({i,s:c.hp*0.4+c.power*7+c.speed*12+(c.def||5)*5+(c.id==='pisani'?999:0)}))
      .filter(o=>o.i!==me).sort((a,b)=>a.s-b.s).map(o=>o.i);
    this.tournament={order,idx:0,wins:0};
    this.sel[1]=order[0];this.startMatch();},
  startRound(){this.reset();
    this.p[0]=new Fighter(ROSTER[this.sel[0]],Math.round(W*.32),1,P1MAP);
    this.p[1]=new Fighter(ROSTER[this.sel[1]],Math.round(W*.68),-1,this.mode===2?P2MAP:'cpu');
    if(this.p[1].ctrl==='cpu'){const d=this.cpuDiff();this.p[1].aiDiff=d;
      this.p[1].maxHp=this.p[1].hp=Math.round(this.p[1].cfg.hp*d.hp);}
    this.timer=99;this.timerF=0;this.koPending=false;
    this.banner='ROUND '+this.round;this.bannerT=IS_MOBILE?30:70;this.freeze=IS_MOBILE?40:100;
    setTimeoutFrames(IS_MOBILE?30:70,()=>{this.banner='COMBATTETE!';this.bannerT=IS_MOBILE?15:30;sfx.ok();});},
  onKO(loser){if(this.koPending)return;this.koPending=true;
    const wIdx=this.p[0]===loser?1:0;this.wins[wIdx]++;
    this.banner='K.O.';this.bannerT=80;
    setTimeoutFrames(90,()=>{
      if(this.wins[wIdx]>=2){this.matchWinner=this.p[wIdx];
        this.playerLost=(this.mode!==2&&wIdx===1);
        if(this.mode===3&&wIdx===0&&this.tournament)this.tournament.wins++;
        this.state='victory';if(this.playerLost)sfx.ko();else sfx.ok();
        if(this.matchWinner&&this.matchWinner.cfg.id==='pisani'){const d=playClassical();if(d)this.musicHold=Math.ceil(d*60)+20;}}
      else{this.round++;this.startRound();}});},
  timeout(){if(this.koPending)return;this.koPending=true;
    const h0=this.p[0].hp/this.p[0].maxHp,h1=this.p[1].hp/this.p[1].maxHp;
    const wIdx=h0>=h1?0:1;this.wins[wIdx]++;this.banner='TEMPO!';this.bannerT=80;
    setTimeoutFrames(90,()=>{
      if(this.wins[wIdx]>=2){this.matchWinner=this.p[wIdx];
        this.playerLost=(this.mode!==2&&wIdx===1);
        if(this.mode===3&&wIdx===0&&this.tournament)this.tournament.wins++;
        this.state='victory';}
      else{this.round++;this.startRound();}});},
};

/* ---------- UPDATE ---------- */
let kPrev={};
function kp(code){return !!keys[code]&&!kPrev[code];}

function update(){
  frame++;
  if(game.musicHold>0){game.musicHold--;if(game.state!=='victory')game.musicHold=0;}
  wantTrack=game.musicHold>0?'hush':game.state==='fight'?'fight':game.state==='victory'?(game.playerLost?'lose':'win'):'menu';
  ensureMusic();
  if(kp('KeyM')){musicMuted=!musicMuted;if(!musicMuted&&curTrack)curTrack.play().catch(()=>{});}
  frameTimers=frameTimers.filter(t=>{if(--t.fr<=0){t.fn();return false}return true});
  if(whiteFlash>0)whiteFlash--;
  if(specialBanner&&--specialBanner.t<=0)specialBanner=null;
  if(specialCutIn&&--specialCutIn.t<=0)specialCutIn=null;

  if(game.state==='title'){
    if(kp('Digit1')||kp('Numpad1')){game.mode=1;game.tournament=null;game.state='select';game.pickTurn=0;sfx.ok();}
    if(kp('Digit2')||kp('Numpad2')){game.mode=2;game.tournament=null;game.state='select';game.pickTurn=0;sfx.ok();}
    if(kp('Digit3')||kp('Numpad3')){game.mode=3;game.tournament=null;game.state='select';game.pickTurn=0;sfx.ok();}
    if(kp('KeyD')){const ks=['facile','normale','difficile'];
      game.difficulty=ks[(ks.indexOf(game.difficulty)+1)%3];sfx.sel();}
  }
  else if(game.state==='select'){
    const turn=game.pickTurn;
    const map=turn===0?P1MAP:(game.mode===2?P2MAP:P1MAP);
    let s=game.sel[turn];
    if(kp(map.left)){s=(s+11)%12;sfx.sel();}
    if(kp(map.right)){s=(s+1)%12;sfx.sel();}
    if(kp(map.up)||kp(map.down)){s=(s+6)%12;sfx.sel();}
    game.sel[turn]=s;
    if(kp(map.punch)||kp('Enter')){sfx.ok();
      if(turn===0){
        if(game.mode===3)game.startTournament();
        else{game.pickTurn=1;if(game.sel[1]===game.sel[0])game.sel[1]=(game.sel[0]+1)%12;}}
      else game.startMatch();}
    if(kp('KeyR')){game.sel[turn]=(Math.random()*12)|0;sfx.ok();
      if(turn===0){if(game.mode===3)game.startTournament();else game.pickTurn=1;}
      else game.startMatch();}
    if(kp('Escape')){if(game.pickTurn===1)game.pickTurn=0;else game.state='title';}
  }
  else if(game.state==='fight'){
    if(hitstop>0){hitstop--;}
    else{
      if(game.freeze>0)game.freeze--;
      const [a,b]=game.p;
      if(game.freeze<=0&&!game.koPending){
        a.readInput(b);b.readInput(a);
        a.update(b);b.update(a);
        const ha=a.hurtbox(),hb2=b.hurtbox();
        if(aabb(ha,hb2)&&a.state!=='ko'&&b.state!=='ko'){
          const ov=(Math.min(ha.x+ha.w,hb2.x+hb2.w)-Math.max(ha.x,hb2.x))/2;
          const d=Math.sign(b.x-a.x)||1;a.x-=ov*d;b.x+=ov*d;}
        if(++game.timerF>=60){game.timerF=0;if(--game.timer<=0)game.timeout();}
      }else{a.input={};b.input={};a.update(b);b.update(a);}
      // camera parallasse
      const target=clamp(((a.x+b.x)/2-W/2)*.3,-44,44);
      camX+=(target-camX)*.08;
      // proiettili
      updateBeams();updateFxObjs();
      projectiles=projectiles.filter(p=>{
        p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=p.grav;p.life--;
        if(!p.hidden&&frame%3===0)particles.push({x:p.x,y:p.y,vx:0,vy:0,life:6,max:6,col:p.col,sz:2});
        const tgt=p.owner===game.p[0]?game.p[1]:game.p[0];
        const hb={x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h};
        let boom=false;
        if(tgt.state!=='ko'&&aabb(hb,tgt.hurtbox())){boom=true;
          if(p.aoe)explode(p,tgt);else tgt.takeDamage(p.dmg*(p.owner.cfg.power/7)*p.owner.dmgMul,p.kb,p.owner);
          if(p.starShot){ring(p.x,p.y,'#FFD700',6,90);ring(p.x,p.y,'#FFFFFF',4,50);spark(p.x,p.y,'#FFD700',18,6);
            for(let i=0;i<6;i++)_padd({star:true,x:p.x,y:p.y,vx:rnd(-3,3),vy:rnd(-3,1),life:24,max:24,col:'#FFF3B0',sz:3});
            whiteFlash=Math.max(whiteFlash,2);shake=Math.max(shake,8);}}
        if(p.bounceKill&&p.y>=GROUND-4){explode(p,tgt);boom=true;}
        if(p.x<-30||p.x>W+30)return false;
        return !boom&&p.life>0;});
    }
    if(game.bannerT>0)game.bannerT--;
    updateFx();
    if(kp('Escape')){game.state='select';game.pickTurn=0;}
  }
  else if(game.state==='victory'){
    if(!game.playerLost){vcfxFrame=vcfxFrame||0;vcfxFrame++;}
    updateFx();
    if(kp('Enter')||kp('KeyZ')){sfx.ok();vcfxFrame=0;
      const t=game.tournament;
      if(game.mode===3&&t&&!game.playerLost&&t.idx<t.order.length-1){
        t.idx++;game.sel[1]=t.order[t.idx];game.startMatch();}
      else{game.tournament=null;game.state='select';game.pickTurn=0;}}
    if(kp('Escape')){game.tournament=null;game.state='title';}
  }
  kPrev={...keys};
}
function updateFx(){
  particles=particles.filter(p=>{
    if(p.ring){p.r+=p.growth;return --p.life>0&&p.r<p.maxR*1.2;}
    p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=p.grav;
    if(p.splat&&p.y>=GROUND){p.y=GROUND;p.vx*=.5;p.vy=0;}
    return --p.life>0;});
  floatTexts=floatTexts.filter(t=>{t.y-=0.6;return --t.life>0;});
  if(shake>0)shake*=0.85;
}
function explode(p,tgt){
  sfx.boom();shake=Math.max(shake,9);whiteFlash=1;
  for(let i=0;i<22;i++)particles.push({x:p.x,y:p.y,vx:rnd(-4.5,4.5),vy:rnd(-4.5,2),life:rnd(12,26),max:26,
    col:['#FF6A00','#FFB000','#FFE94A','#777'][i%4],sz:rnd(3,7)});
  smokePuff(p.x,p.y-8,8);
  const r=p.aoe||50,hb={x:p.x-r,y:p.y-r,w:r*2,h:r*2};
  if(tgt.state!=='ko'&&aabb(hb,tgt.hurtbox()))tgt.takeDamage(p.dmg*(p.owner.cfg.power/7)*p.owner.dmgMul,p.kb,p.owner);
}

/* ---------- DRAW ---------- */
function text(t,x,y,sz,col,align='center'){ctx.fillStyle=col;ctx.font='bold '+sz+'px monospace';ctx.textAlign=align;ctx.fillText(t,x,y);}
function outlineText(t,x,y,sz,col,align='center'){ctx.font='bold '+sz+'px monospace';ctx.textAlign=align;
  ctx.fillStyle='#000';for(const[ox,oy]of[[-2,0],[2,0],[0,-2],[0,2]])ctx.fillText(t,x+ox,y+oy);
  ctx.fillStyle=col;ctx.fillText(t,x,y);}

function drawPortrait(cfg,x,y,s){
  if(drawSpritePortrait(cfg,x,y,s))return;
  /* immagine ancora in arrivo: riquadro vuoto con puntini */
  pxs(x,y,s,s,'#1A140C');pxs(x+2,y+2,s-4,s-4,'#241B10');
  for(let k=0;k<3;k++){ctx.globalAlpha=.3+.5*((((frame/12)|0)%3)===k);pxs(x+s/2-10+k*8,y+s/2-2,4,4,'#B7A98C');}
  ctx.globalAlpha=1;return;
  pxs(x,y,s,s,'#1A140C');pxs(x+2,y+2,s-4,s-4,'#241B10');
  const hw=s*.56,hx=x+s*.16,hy=y+s*.36;

function drawHUD(){
  const [a,b]=game.p;
  for(const[f,side]of[[a,0],[b,1]]){
    const mg=Math.max(66,Math.round(118*W/(cv.clientWidth||W))),x=side===0?mg:W-mg-250,flip=side===1;
    pxs(x-1,13,252,18,'#000');pxs(x,14,250,16,'#1A1A1A');
    const r=f.hp/f.maxHp,col=r>.5?'#2ECC40':r>.25?'#FFDC00':'#FF4136';
    const w=246*r;pxs(flip?x+2+246-w:x+2,16,w,12,col);
    pxs(flip?x+2+246-w:x+2,16,w,4,lift(col,.4));
    // stamina
    pxs(x,33,250,7,'#0B3954');
    const sw=246*f.stamina/100;pxs(flip?x+2+246-sw:x+2,34,sw,5,'#39CCCC');
    // SPECIAL METER (giallo) con tacca del costo + cooldown
    pxs(x,42,250,8,'#3A3000');
    const cost=f.cfg.special.cost,ready=f.specialReady;
    const mw=246*f.meter/METER_MAX;
    pxs(flip?x+2+246-mw:x+2,43,mw,6,ready?(frame%20<10?'#FFFFFF':'#FFD700'):'#B89000');
    const tk=246*cost/METER_MAX;
    pxs(flip?x+2+246-tk:x+2+tk,42,2,8,'#F5F0E1');
    if(f.cooldown>0){const cw=246*f.cooldown/f.cfg.special.cd;
      ctx.globalAlpha=.55;pxs(flip?x+2+246-cw:x+2,43,cw,6,'#222');ctx.globalAlpha=1;
      outlineText('RICARICA',flip?x+250:x,52,8,'#8A7E68',flip?'right':'left');}
    else if(ready)outlineText('SPECIAL!',flip?x+250:x,52,8,'#FFD700',flip?'right':'left');
    outlineText(f.cfg.name,flip?x+250:x,66,12,f.cfg.ui||f.cfg.brow,flip?'right':'left');
    for(let i=0;i<2;i++)pxs(flip?x+250-12-i*14:x+i*14,71,10,6,game.wins[side]>i?'#FFD700':'#3A3A3A');
    if(f.combo>1)outlineText(f.combo+' COMBO x'+COMBO_MUL[Math.min(f.combo,3)],flip?x+250:x,92,13,'#FFD700',flip?'right':'left');
  }
  outlineText(game.timer,W/2,30,22,'#F5F0E1');
  if(game.mode===3&&game.tournament)
    outlineText('TORNEO '+(game.tournament.idx+1)+'/'+game.tournament.order.length,W/2,46,10,'#FF8C00');
  if(!IS_MOBILE)text('PUGNO+CALCIO insieme (o SPAZIO / I) = SPECIAL quando la barra gialla \u00E8 piena',W/2,H-6,8.5,'rgba(245,240,225,.45)');
}

function draw(){
  ctx.save();
  if(shake>0.5)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  if(game.state==='title')drawTitle();
  else if(game.state==='select')drawSelect();
  else if(game.state==='fight')drawFight();
  else if(game.state==='victory')drawVictory();
  ctx.restore();
  if(whiteFlash>0){ctx.globalAlpha=.85;ctx.fillStyle='#FFF';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}

function drawTitle(){
  ctx.fillStyle='#0E0A06';ctx.fillRect(0,0,W,H);
  ROSTER.forEach((c,i)=>{const x=(i*97+frame*.4)%(W+60)-30,y=70+(i%4)*100+Math.sin(frame*.03+i)*8;
    ctx.globalAlpha=.25;ctx.fillStyle=c.brow;ctx.fillRect(x,y,26,7);ctx.fillRect(x+34,y,26,7);ctx.globalAlpha=1;});
  outlineText('LE SOPRACCIGLIA',W/2,140,38,'#FFD700');
  outlineText('DELLA GUERRA',W/2,185,38,'#FFD700');
  text('A R E N A   C O M B A T',W/2,218,16,'#DC143C');
  text('\u2014 METAL SLUG EDITION \u2014',W/2,240,11,'#FF8C00');
  text('Dal racconto corale dell\u2019ufficio di Siena',W/2,262,11,'#B7A98C');
  if(frame%60<40){outlineText('[1] GIOCATORE vs CPU',W/2,312,15,'#F5F0E1');
    outlineText('[2] GIOCATORI',W/2,336,15,'#F5F0E1');
    outlineText('[3] TORNEO \u2014 sfida tutti, dal pi\u00F9 debole al boss',W/2,360,15,'#FF8C00');}

  text('P1: frecce + Z pugno / X calcio / C parata / SPAZIO special',W/2,406,10,'#8A7E68');
  text('P2: WASD + L pugno / K calcio / J parata / I special',W/2,422,10,'#8A7E68');

  text('PARRY: tocca la parata un istante prima dell\u2019impatto \u2192 stordisce 2s  \u2022  [M] musica on/off',W/2,460,9,'#8A7E68');

function drawSelect(){
  ctx.fillStyle='#120D08';ctx.fillRect(0,0,W,H);
  outlineText(game.pickTurn===1&&game.mode===1?'SCEGLI L\u2019AVVERSARIO':'SCEGLI IL TUO COMBATTENTE',W/2,36,18,game.pickTurn===1?'#FF4136':'#FFD700');
  const cs=86,gx=(W-6*(cs+8))/2+4,gy=56;
  ROSTER.forEach((c,i)=>{
    const col=i%6,row=(i/6)|0,x=gx+col*(cs+8),y=gy+row*(cs+34);
    drawPortrait(c,x,y,cs);
    text(c.name,x+cs/2,y+cs+12,8.5,'#F5F0E1');
    if(game.sel[0]===i){ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.strokeRect(x-2,y-2,cs+4,cs+4);}
    if(game.pickTurn===1&&game.sel[1]===i){ctx.strokeStyle='#DC143C';ctx.lineWidth=3;ctx.strokeRect(x-5,y-5,cs+10,cs+10);}
  });
  const cur=ROSTER[game.sel[game.pickTurn]],s=cur.special;
  outlineText(cur.name+' \u2014 '+cur.title,W/2,gy+2*(cs+34)+22,14,cur.ui||cur.brow);
  text('SPECIAL: '+s.name+'  ('+s.dmg+' dmg \u2022 costo '+s.cost+' \u2022 CD '+(s.cd/60).toFixed(1)+'s)   |   HP '+cur.hp+'  VEL '+Math.round(cur.speed*2)+'  POT '+cur.power+'  DEF '+cur.def,W/2,gy+2*(cs+34)+42,10,'#B7A98C');
  const hint1=game.mode===2?'P2: scegli il tuo lottatore (L o Z conferma \u2022 R casuale)':'Scegli l\u2019AVVERSARIO della CPU (Z conferma \u2022 R casuale \u2022 ESC indietro)';
  const hint0=game.mode===3?'TORNEO: scegli il tuo CAMPIONE (Z conferma \u2022 R casuale)':'P1: scegli il tuo lottatore (Z conferma \u2022 R casuale)';
  if(!IS_MOBILE)text(game.pickTurn===0?hint0:hint1,W/2,H-12,11,game.pickTurn===0?(game.mode===3?'#FF8C00':'#FFD700'):'#DC143C');
}

function drawFight(){
  if(drawBg(game.bg))text(BACKGROUNDS[game.bg].toUpperCase(),W/2,H-18,9,'rgba(245,240,225,.45)');
  else{STAGES[game.stage].draw(camX);text(STAGES[game.stage].name,W/2,H-18,9,'rgba(245,240,225,.35)');}
  ctx.save();ctx.translate(-camX*0.0,0); // fighters in world≈screen, cam già nei layer
  const ps=[...game.p].sort((a,b)=>(a.state==='attack'?1:0)-(b.state==='attack'?1:0));
  drawBeams();
  ps.forEach(drawFighter);
  drawBeamFlashes();drawFxObjs();
  projectiles.forEach(p=>{
    if(p.hidden)return;
    if(p.starShot){p.rot+=.25;
      ctx.globalAlpha=.3;ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(p.x,p.y,26+Math.sin(frame*.6)*3,0,7);ctx.fill();
      ctx.globalAlpha=.55;drawStar(p.x-p.vx*2,p.y-p.vy*2,16,7,p.rot-.4,'#FF8C00');
      ctx.globalAlpha=1;drawStar(p.x,p.y,18,8,p.rot,'#FFD700');drawStar(p.x,p.y,9,4,p.rot,'#FFFFFF');
      if(frame%2===0)_padd({star:true,x:p.x-p.vx*3+rnd(-6,6),y:p.y-p.vy*3+rnd(-6,6),vx:0,vy:0,life:14,max:14,col:'#FFE94A',sz:3});
      return;}
    if(p.bigShot){ctx.globalAlpha=.35;pxs(p.x-p.vx*2-p.w/2,p.y-p.h/2,p.w+Math.abs(p.vx)*2,p.h,'#FF8C00');ctx.globalAlpha=1;}
    pxs(p.x-p.w/2,p.y-p.h/2,p.w,p.h,p.col);pxs(p.x-p.w/2,p.y-p.h/2,p.w,1,'#FFF');});
  particles.forEach(p=>{
    ctx.globalAlpha=clamp(p.life/(p.max||20),0,1)*(p.fade?.7:1);
    if(p.ring){ctx.strokeStyle=p.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();
      ctx.globalAlpha*=.4;ctx.strokeStyle='#E8C8FF';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,p.r-3,0,7);ctx.stroke();}
    else if(p.bar)pxs(p.x,p.y,p.w,p.h,p.col);
    else if(p.star){pxs(p.x-1,p.y-3,3,7,p.col);pxs(p.x-3,p.y-1,7,3,p.col);}
    else pxs(p.x,p.y,p.sz,p.sz,p.col);
    ctx.globalAlpha=1;});
  floatTexts.forEach(t=>{outlineText(t.txt,t.x,t.y,t.sz,t.col);});
  if(specialCutIn){ctx.fillStyle='rgba(0,0,0,'+(.5*specialCutIn.t/22).toFixed(2)+')';
    ctx.fillRect(0,0,W,H);drawFighter(specialCutIn.f);}
  ctx.restore();
  drawHUD();
  if(specialBanner)outlineText(specialBanner.txt,W/2,H/2-70,20,'#FF2222');
  if(game.bannerT>0){const big=game.banner==='K.O.';
    outlineText(game.banner,W/2,H/2-20,big?64:34,big?'#FF4136':'#FFD700');}
}

/* Victory-pose: usa l'immagine reale del personaggio */
function drawVictoryPose(f,vcfg,t){
  const SV=SPRITE_CHARS[f.cfg.id];
  if(SV&&SV.ready&&imgOk(SV.img[SV.anims.win.file])){const a=SV.anims.win,sc=3,cx=W*.26,fy=H*.92;
    ctx.globalAlpha=.35;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(cx,fy+4,90,10,0,0,7);ctx.fill();ctx.globalAlpha=1;
    drawSpriteFrame(SV,a,Math.floor(t*a.fps/60)%a.n,cx,fy+((a.dy&&a.dy.all)||0)*sc,sc,1,false);return;}
  const img=SPRITES[f.cfg.id];
  if(!img||!img.complete||img.naturalWidth===0){
    // fallback: disegna il fighter procedurale
    const ox=f.x,oy=f.y,os=f.state,ocur=f.cur,oaT=f.animT;
    f.animT=t; f.x=W*.26; f.y=GROUND; f.facing=1; f.state='idle'; f.cur=null;
    const sc=Math.min(200/f.cfg.h,1.6);
    ctx.save();ctx.translate(W*.26,GROUND);ctx.scale(sc,sc);ctx.translate(-W*.26/sc,-GROUND/sc);
    drawFighter(f);ctx.restore();
    f.x=ox;f.y=oy;f.state=os;f.cur=ocur;f.animT=oaT;return;}
  // Immagine reale: altezza target 320px, centrata sul terzo sinistro
  const targetH=320;
  const targetW=Math.round(img.naturalWidth*targetH/img.naturalHeight);
  const drawX=Math.round(W*.05+(W*.42-targetW)/2); // centrata nel blocco sinistro
  const drawY=Math.round(H*.92-targetH);            // piedi a 92% dello schermo
  // ombra sotto il personaggio
  const shadowW=targetW*.6;
  ctx.save();
  ctx.globalAlpha=.35;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(drawX+targetW/2,H*.92+6,shadowW/2,10,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  // glow del colore delle sopracciglia intorno all'immagine
  const pulse=.25+.2*Math.sin(t*.07);
  ctx.shadowBlur=32*pulse;
  ctx.shadowColor=f.cfg.brow||'#FFD700';
  ctx.drawImage(img,drawX,drawY,targetW,targetH);
  ctx.shadowBlur=0;
  // rim light overlay: gradiente laterale sul lato dx
  const rimG=ctx.createLinearGradient(drawX,0,drawX+targetW,0);
  rimG.addColorStop(0,'rgba(0,0,0,0)');
  rimG.addColorStop(.7,'rgba(0,0,0,0)');
  rimG.addColorStop(1,hexToRgba(f.cfg.brow||'#FFD700',pulse*.5));
  ctx.fillStyle=rimG;
  ctx.fillRect(drawX,drawY,targetW,targetH);
  ctx.restore();
}
function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a.toFixed(2)+')';}

  // SEPARATORE
  if(introT>.5){ctx.globalAlpha=(introT-.5)/.5;ctx.fillStyle=wf.cfg.brow||'#FFD700';
    ctx.fillRect(px2+16,ptop+84,pw-32,2);ctx.globalAlpha=1;}

  // STATISTICHE match
  const R=game.tournament;
  ctx.save();ctx.globalAlpha=introT*.75;ctx.font='11px monospace';ctx.textAlign='left';ctx.fillStyle='#D0C8A0';

  ctx.restore();

  // CITAZIONE PERSONALIZZATA (fade-in dopo 1s)
  if(textT>0){
    ctx.save();ctx.globalAlpha=textT*.9;
    ctx.font='italic 12px monospace';ctx.textAlign='center';ctx.fillStyle='#F5F0E1';
    wrapText('\u201C'+vcfg.quote+'\u201D',px2+pw/2,ptop+172,pw-28,16);
    ctx.restore();}

  // TORNEO: prossimo sfidante
  if(game.mode===3&&R&&textT>.5){
    ctx.globalAlpha=(textT-.5)/.5*.85;ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.fillRect(px2,ptop+ph-54,pw,54);ctx.globalAlpha=1;
    if(R.idx<R.order.length-1){
      outlineText('INCONTRO '+(R.idx+1)+'/'+R.order.length+' SUPERATO',px2+pw/2,ptop+ph-30,11,'#FF8C00');

    }else outlineText('\u2605 CAMPIONE DEL TORNEO! '+R.wins+'/'+R.order.length+' \u2605',px2+pw/2,ptop+ph-20,14,'#FFD700');}

  // PROMPT
  const pTxt=IS_MOBILE?(game.mode===3&&R&&R.idx<R.order.length-1?'Tocca per il prossimo incontro':'Tocca per una nuova sfida'):(game.mode===3&&R&&R.idx<R.order.length-1?'[INVIO] prossimo incontro   [ESC] abbandona':'[INVIO] nuova sfida   [ESC] titolo');
  if(frame%60<40)text(pTxt,W/2,H-10,10,'#B7A98C');

  // screen flash all'inizio (0-10fr)
  if(t<10){ctx.globalAlpha=(1-t/10)*.85;ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}
function wrapText(t,x,y,maxW,lh){
  const words=t.split(' ');let line='',yy=y;
  for(const w of words){const test=line+w+' ';
    if(ctx.measureText(test).width>maxW){ctx.fillText(line,x,yy);line=w+' ';yy+=lh;}else line=test;}
  ctx.fillText(line,x,yy);
}

/* ---------- LOOP con delta-time ---------- */
let _lastTs=0, _fpsSmooth=60, _fpsCount=0, _fpsSec=0;
function loop(ts){
  const dt=_lastTs?Math.min(ts-_lastTs,100):16.67; // cap 100ms (evita spiral of death)
  _lastTs=ts;

  /* FPS smoothed */
  _fpsCount++; _fpsSec+=dt;
  if(_fpsSec>=1000){_fpsSmooth=Math.round(_fpsCount*1000/_fpsSec);_fpsCount=0;_fpsSec=0;}

  /* Quanti step di gioco (a 60fps) simulare in questo frame */
  const steps=Math.min(Math.round(dt/16.67),3);
  for(let s=0;s<steps;s++){
    try{update();}catch(e){
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#FF4136';ctx.font='14px monospace';ctx.textAlign='center';
      ctx.fillText('ERR: '+e.message,W/2,H/2);
      break;
    }
  }
  try{draw();}catch(e){
    ctx.fillStyle='#FF4136';ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText('ERR draw: '+e.message,W/2,H/2+40);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);


/* ============================================================
   MOBILE TOUCH LAYER v4 — coordinate raw, nessun elemento listener
   ============================================================ */
(function(){
  var IS_MOB = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  /* da computer: home, pulsanti e menu sì; i controlli touch del combattimento no */

  /* Pulsanti d'azione: elemento → codice tasto */
  var BTN_KEYS = { 'ab-p':'KeyZ', 'ab-k':'KeyX', 'ab-b':'KeyC', 'ab-s':'Space' };
  var DIRS = { ArrowLeft:'dp-l', ArrowRight:'dp-r', ArrowUp:'dp-u', ArrowDown:'dp-d' };
  var btnTouch = {};      /* touchId → id pulsante */
  var stickId = null;     /* touchId del pollice sul joystick */

  function setKey(code, val, elId){
    keys[code] = val;
    var el = document.getElementById(elId);
    if(el) el.classList.toggle('on', val);
  }
  function btnAtPoint(cx, cy){
    for(var id in BTN_KEYS){
      var r = document.getElementById(id).getBoundingClientRect();
      if(cx >= r.left-6 && cx <= r.right+6 && cy >= r.top-6 && cy <= r.bottom+6) return id;
    }
    return null;
  }
  function inStick(cx, cy){
    var r = document.getElementById('m-dpad').getBoundingClientRect();
    return cx >= r.left-24 && cx <= r.right+24 && cy >= r.top-24 && cy <= r.bottom+24;
  }
  /* joystick a 8 direzioni: direzione calcolata dal centro del D-pad */
  function updateStick(cx, cy){
    var r = document.getElementById('m-dpad').getBoundingClientRect();
    var dx = cx - (r.left + r.width/2), dy = cy - (r.top + r.height/2);
    var ax = Math.abs(dx), ay = Math.abs(dy), dz = r.width * 0.12;
    var lim = r.width * 0.3, len = Math.hypot(dx, dy) || 1, k = Math.min(1, lim / len);
    var kn = document.getElementById('m-knob'); if(kn) kn.style.transform = 'translate('+(dx*k)+'px,'+(dy*k)+'px)';
    var h = ax > dz && ax > ay * 0.45, v = ay > dz && ay > ax * 0.45;
    setKey('ArrowLeft',  h && dx < 0, 'dp-l');
    setKey('ArrowRight', h && dx > 0, 'dp-r');
    setKey('ArrowUp',    v && dy < 0, 'dp-u');
    setKey('ArrowDown',  v && dy > 0, 'dp-d');
  }
  function releaseStick(){ for(var k in DIRS) setKey(k, false, DIRS[k]); stickId = null;
    var kn = document.getElementById('m-knob'); if(kn) kn.style.transform = ''; }
  function releaseAll(){
    releaseStick();
    for(var t in btnTouch) setKey(BTN_KEYS[btnTouch[t]], false, btnTouch[t]);
    btnTouch = {};
  }
  window._releaseTouchKeys = releaseAll;

  function onTouchStart(e){
    if(game.state !== 'fight') return;
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      var id = btnAtPoint(t.clientX, t.clientY);
      if(id){ btnTouch[t.identifier] = id; setKey(BTN_KEYS[id], true, id); }
      else if(stickId === null && inStick(t.clientX, t.clientY)){
        stickId = t.identifier; updateStick(t.clientX, t.clientY);
      }
    }
  }
  function onTouchMove(e){
    e.preventDefault();
    if(game.state !== 'fight') return;
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      if(t.identifier === stickId){ updateStick(t.clientX, t.clientY); continue; }
      var oldId = btnTouch[t.identifier];
      if(!oldId) continue;
      var newId = btnAtPoint(t.clientX, t.clientY);
      /* scivolando su un altro pulsante si cambia tasto; uscendo nel vuoto si resta premuti */
      if(newId && newId !== oldId){
        setKey(BTN_KEYS[oldId], false, oldId);
        btnTouch[t.identifier] = newId; setKey(BTN_KEYS[newId], true, newId);
      }
    }
  }
  function onTouchEnd(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      if(t.identifier === stickId) releaseStick();
      var id = btnTouch[t.identifier];
      if(id){ setKey(BTN_KEYS[id], false, id); delete btnTouch[t.identifier]; }
    }
    if(game.state === 'fight') e.preventDefault();
  }

  document.addEventListener('touchstart',  onTouchStart, {passive:false});
  document.addEventListener('touchend',    onTouchEnd,   {passive:false});
  document.addEventListener('touchcancel', onTouchEnd,   {passive:false});
  document.addEventListener('touchmove',   onTouchMove,  {passive:false});

  /* ---- navigazione (title / select / victory) — fight gestito da zone sopra ---- */
  document.addEventListener('touchstart', function(e){
    audioUnlocked = true;
    try{ if(AC && AC.state==='suspended') AC.resume(); }catch(_){}
    /* iOS: chiama ensureMusic() sincrono dentro il touch handler */
    ensureMusic();
    if(game.state === 'fight') return; /* fight gestito dal zone handler */

    var touch = e.changedTouches[0];

    /* --- TITLE: tappa ovunque nella metà inferiore per scegliere --- */
    if(game.state === 'title'){
      e.preventDefault();
      /* Calcola zona dal canvas se il tocco è sul canvas, altrimenti usa posizione schermo */
      var cvEl = document.getElementById('cv');
      var rect = cvEl ? cvEl.getBoundingClientRect() : null;
      var ty = rect ? (touch.clientY - rect.top) * (480 / rect.height) : 999;
      var tx = rect ? (touch.clientX - rect.left) * (W / rect.width) : 999;
      var inCanvas = rect && touch.clientX>=rect.left && touch.clientX<=rect.right && touch.clientY>=rect.top && touch.clientY<=rect.bottom;

      /* In title state la navigazione è gestita dai bottoni HTML home-screen.
         Il canvas sotto è coperto dall'overlay — non fare nulla qui. */
      return;
    }

    /* --- SELECT: tap sui ritratti personaggio --- */
    if(game.state === 'select'){
      var cvEl = document.getElementById('cv');
      var rect = cvEl ? cvEl.getBoundingClientRect() : null;
      if(!rect) return;
      var tx = (touch.clientX - rect.left) * (W / rect.width);
      var ty = (touch.clientY - rect.top)  * (480 / rect.height);
      /* Griglia personaggi */
      var cs=86, gx=(W-6*(cs+8))/2+4, gy=56;
      for(var i=0;i<12;i++){
        var col=i%6, row=(i/6)|0;
        var x=gx+col*(cs+8), y=gy+row*(cs+34);
        if(tx>=x && tx<=x+cs && ty>=y && ty<=y+cs){
          e.preventDefault();
          /* primo tocco: seleziona e mostra le statistiche; secondo tocco sullo stesso: conferma */
          if(game.sel[game.pickTurn]===i) confirmPick();
          else { game.sel[game.pickTurn]=i; try{sfx.sel();}catch(_){} }
          break;
        }
      }
      return;
    }

    /* --- VICTORY: tocca per continuare --- */
    if(game.state==='victory'){
      e.preventDefault();
      keys['Enter']=true; setTimeout(function(){ keys['Enter']=false; },120);
      return;
    }

  }, {passive:false});

  /* ---- overlay fight controls (D-pad + bottoni azione) ---- */
  var _prev='';
  function updateOverlay(){

    function sh(id,v){ var el=document.getElementById(id); if(el) el.style.display=v; }

    sh('select-btns', s==='select' ? 'flex' : 'none');
    sh('m-controls',  s==='fight'&&IS_MOB ? 'block' : 'none');
    sh('m-esc',       s==='fight'  ? 'flex' : 'none');
    sh('m-back',      (s==='select'||s==='victory') ? 'flex' : 'none');
    sh('m-music',     'flex');
    /* Sincronizza label difficoltà nella home */
    var dv = document.getElementById('hb-diff-val');
    if(dv){ var dl={facile:'Facile',normale:'Normale',difficile:'Difficile'};
      dv.textContent = dl[game.difficulty]||'Normale'; }
  }

  /* ---- Stelle che scintillano nella home ---- */
  (function(){
    var c=document.getElementById('hs-stars');if(!c)return;var x=c.getContext('2d'),stars=[];
    function size(){var r=window.devicePixelRatio||1;c.width=innerWidth*r;c.height=innerHeight*r;
      stars=[];var n=Math.round(innerWidth*innerHeight/2600);
      for(var i=0;i<n;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:(Math.random()*1.3+.3)*r,
        p:Math.random()*6.3,s:.6+Math.random()*2.2,b:Math.random()<.08});}
    size();addEventListener('resize',size);
    function tick(t){
      if(game.state==='title'){x.clearRect(0,0,c.width,c.height);
        for(var i=0;i<stars.length;i++){var st=stars[i],a=.35+.65*Math.max(0,Math.sin(t/1000*st.s+st.p));
          x.globalAlpha=a;x.fillStyle=st.b?'#FFE9A8':'#fff';x.fillRect(st.x,st.y,st.r,st.r);
          if(st.b&&a>.85){x.globalAlpha=(a-.85)*4;x.fillRect(st.x-st.r*2,st.y+st.r/2-.5,st.r*5,1);x.fillRect(st.x+st.r/2-.5,st.y-st.r*2,1,st.r*5);}}
        x.globalAlpha=1;}
      requestAnimationFrame(tick);}
    requestAnimationFrame(tick);
  })();

  function confirmPick(){
    try{sfx.ok();}catch(_){}
    if(game.pickTurn===0){
      if(game.mode===3) game.startTournament();
      else{ game.pickTurn=1; if(game.sel[1]===game.sel[0]) game.sel[1]=(game.sel[0]+1)%12; }
    } else game.startMatch();

  }

  /* ---- listener bottoni overlay ---- */
  function _btn(id, fn){

      e.preventDefault(); e.stopPropagation();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
